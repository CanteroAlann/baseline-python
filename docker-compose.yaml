services:
  rabbitmq:
    build:
      context: .
      dockerfile: src/rabbitmq/Dockerfile
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
      MOM_HOST: rabbitmq
      RESULT_EXCHANGE: article_results
      OUTPUT_QUEUE: articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  gateway_2:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
      MOM_HOST: rabbitmq
      RESULT_EXCHANGE: article_results
      OUTPUT_QUEUE: articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  year-filter:
    build:
      context: .
      dockerfile: src/filters/year_filter/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: articles
      OUTPUT_EXCHANGE: articles_by_year
      PRE2020_QUEUE: articles_pre2020
      POST2020_QUEUE: articles_post2020
      PRE2020_ROUTING_KEY: article.pre2020
      POST2020_ROUTING_KEY: article.post2020
    depends_on:
      rabbitmq:
        condition: service_healthy
  language-filter:
    build:
      context: .
      dockerfile: src/filters/language_filter/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: articles_pre2020
      INPUT_EXCHANGE: articles_by_year
      INPUT_ROUTING_KEY: article.pre2020
      OUTPUT_EXCHANGE: article_results
    depends_on:
      rabbitmq:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      INPUT_FILE: /data/file1.csv
      SERVER_HOST: gateway
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
    depends_on:
      - gateway
      - year-filter
      - language-filter
  client_2:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      INPUT_FILE: /data/file_multi.csv
      SERVER_HOST: gateway_2
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
    depends_on:
      - gateway_2
      - year-filter
      - language-filter
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      PRE2020_ROUTING_KEY: article.pre2020
      POST2020_ROUTING_KEY: article.post2020
    depends_on:
      rabbitmq:
        condition: service_healthy
