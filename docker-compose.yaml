      OUTPUT_EXCHANGE: q5.candidate.counts
      OUTPUT_ROUTING_KEYS: 'q5.candidate.0,q5.candidate.1,q5.candidate.2'
      OUTPUT_BINDINGS: '{"q5.candidate.0": "q5.candidate.0", "q5.candidate.1": "q5.candidate.1", "q5.candidate.2": "q5.candidate.2"}'
