services:
  rabbitmq:
    build:
      context: .
      dockerfile: src/rabbitmq/Dockerfile
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
  gateway_1:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
      MOM_HOST: rabbitmq
      RESULT_EXCHANGE: article_results
      OUTPUT_QUEUE: articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  coordinator_year:
    build:
      context: .
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.year
      OUTPUT_EXCHANGE: articles_by_year
      OUTPUT_ROUTING_KEYS: 'article.pre2020,article.post2020'
      OUTPUT_BINDINGS: '{"articles_pre2020": "article.pre2020", "articles_to_preprocess": "article.*", "articles_biography": "article.pre2020"}'
      QUERY_ID: ''
    depends_on:
      rabbitmq:
        condition: service_healthy
  coordinator_language:
    build:
      context: .
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.language
      OUTPUT_EXCHANGE: article_results
      OUTPUT_ROUTING_KEYS: ''
      OUTPUT_BINDINGS: '{}'
      QUERY_ID: '1'
    depends_on:
      rabbitmq:
        condition: service_healthy
  coordinator_preprocess:
    build:
      context: .
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.preprocess
      OUTPUT_EXCHANGE: preprocessed_articles
      OUTPUT_ROUTING_KEYS: 'article.pre2020,article.post2020'
      OUTPUT_BINDINGS: '{"preprocessed_pre2020": "article.pre2020", "preprocessed_post2020": "article.post2020"}'
      QUERY_ID: ''
      INDEPENDENT_ROUTES: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
  coordinator_q5_historical_words:
    build:
      context: .
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.q5_historical_words
      OUTPUT_EXCHANGE: q5.historical.counts
      OUTPUT_ROUTING_KEYS: 'q5.historical.0,q5.historical.1,q5.historical.2'
      OUTPUT_BINDINGS: '{"q5.historical.0": "q5.historical.0", "q5.historical.1": "q5.historical.1", "q5.historical.2": "q5.historical.2"}'
      QUERY_ID: ''
    depends_on:
      rabbitmq:
        condition: service_healthy
  coordinator_q5_candidate_words:
    build:
      context: .
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
