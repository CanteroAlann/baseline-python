services:
  rabbitmq:
    build:
      context: ../../
      dockerfile: src/rabbitmq/Dockerfile
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s

  gateway_1:
    build:
      context: ../../
      dockerfile: src/gateway/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      ENABLED_QUERY_IDS: "4"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
      MOM_HOST: rabbitmq
      RESULT_EXCHANGE: article_results
      OUTPUT_QUEUE: articles
    depends_on:
      rabbitmq:
        condition: service_healthy

  year-filter_1:
    build:
      context: ../../
      dockerfile: src/filters/year_filter/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: articles
      CONTROL_QUEUE: control.year
      OUTPUT_EXCHANGE: articles_by_year
      PRE2020_QUEUE: articles_pre2020
      PREPROCESS_QUEUE: articles_to_preprocess
      PREPROCESS_ROUTING_KEY: article.*
      BIOGRAPHY_QUEUE: articles_biography
      PRE2020_ROUTING_KEY: article.pre2020
      POST2020_ROUTING_KEY: article.post2020
    depends_on:
      rabbitmq:
        condition: service_healthy

  coordinator_year:
    build:
      context: ../../
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.year
      OUTPUT_EXCHANGE: articles_by_year
      OUTPUT_ROUTING_KEYS: "article.pre2020,article.post2020"
      OUTPUT_BINDINGS: '{"articles_pre2020": "article.pre2020", "articles_to_preprocess": "article.*", "articles_biography": "article.pre2020"}'
      QUERY_ID: ""
    depends_on:
      rabbitmq:
        condition: service_healthy

  preprocess_1:
    build:
      context: ../../
      dockerfile: src/preprocess/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: articles_to_preprocess
      INPUT_EXCHANGE: articles_by_year
      INPUT_ROUTING_KEY: article.*
      OUTPUT_EXCHANGE: preprocessed_articles
      OUTPUT_BINDINGS: '{"preprocessed_pre2020": "article.pre2020", "preprocessed_post2020": "article.post2020", "word_sharder_queue": "article.*"}'
      CONTROL_QUEUE: control.preprocess
    depends_on:
      rabbitmq:
        condition: service_healthy

  coordinator_preprocess:
    build:
      context: ../../
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.preprocess
      OUTPUT_EXCHANGE: preprocessed_articles
      OUTPUT_ROUTING_KEYS: "article.pre2020,article.post2020"
      OUTPUT_BINDINGS: '{"preprocessed_pre2020": "article.pre2020", "preprocessed_post2020": "article.post2020", "word_sharder_queue": "article.*"}'
      QUERY_ID: ""
      INDEPENDENT_ROUTES: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy

  word-sharder_1:
    build:
      context: ../../
      dockerfile: src/word_sharder/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: word_sharder_queue
      INPUT_EXCHANGE: preprocessed_articles
      INPUT_ROUTING_KEY: article.*
      CONTROL_QUEUE: control.word_sharder
      OUTPUT_EXCHANGE: word_chunks
      OUTPUT_BINDINGS: '{"q4.sum.0": "word.shard.0"}'
      SHARD_COUNT: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  coordinator_word_sharder:
    build:
      context: ../../
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.word_sharder
      OUTPUT_EXCHANGE: word_chunks
      OUTPUT_ROUTING_KEYS: "word.shard.0"
      OUTPUT_BINDINGS: '{"q4.sum.0": "word.shard.0"}'
      QUERY_ID: ""
      INDEPENDENT_ROUTES: "true"
      INPUT_ROUTES: "article.pre2020,article.post2020"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q4-sum-0:
    build:
      context: ../../
      dockerfile: src/q4_sum/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: q4.sum.0
      INPUT_EXCHANGE: word_chunks
      INPUT_ROUTING_KEY: word.shard.0
      OUTPUT_QUEUE: q4.join
      SHARD_ID: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy

  q4-join:
    build:
      context: ../../
      dockerfile: src/q4_join/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: q4.join
      OUTPUT_EXCHANGE: article_results
      CONTROL_QUEUE: control.q4_done
      SHARD_COUNT: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  coordinator_q4_final:
    build:
      context: ../../
      dockerfile: src/coordinator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: control.q4_done
      OUTPUT_EXCHANGE: article_results
      OUTPUT_ROUTING_KEYS: ""
      OUTPUT_BINDINGS: "{}"
      QUERY_ID: "4"
      EXPECTED_INPUTS: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy

  client_1:
    build:
      context: ../../
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      ENABLED_QUERY_IDS: "4"
      INPUT_FILE: /data/file_bio_q2.csv
      SERVER_HOST: gateway_1
      SERVER_PORT: "5000"
    volumes:
      - ../../samples:/data:ro
      - ./output:/output
    depends_on:
      - gateway_1
      - year-filter_1
      - coordinator_year
      - preprocess_1
      - coordinator_preprocess
      - word-sharder_1
      - coordinator_word_sharder
      - q4-sum-0
      - q4-join
      - coordinator_q4_final
