services:
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      INPUT_FILE: /data/file1.csv
      SERVER_HOST: gateway
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
    depends_on:
      - gateway
