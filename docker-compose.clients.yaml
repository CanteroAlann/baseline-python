name: tp-distribuidos-clients
services:
  client_1:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      INTERNAL_SERIALIZER: "${INTERNAL_SERIALIZER:-json}"
      INPUT_FILE: /data/file1.csv
      SERVER_HOST: gateway_1
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
      - ./output/client_1:/output
  client_2:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      INTERNAL_SERIALIZER: "${INTERNAL_SERIALIZER:-json}"
      INPUT_FILE: /data/file2.csv
      SERVER_HOST: gateway_1
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
      - ./output/client_2:/output

networks:
  default:
    name: tp-distribuidos
    external: true
