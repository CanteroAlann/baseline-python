services:
  rabbitmq:
    build:
      context: .
      dockerfile: src/rabbitmq/Dockerfile
    environment:
      RABBITMQ_LOG_LEVELS: error
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "5000"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: article_results
      OUTPUT_QUEUE: articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  preprocess:
    build:
      context: .
      dockerfile: src/preprocess/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: articles
      OUTPUT_QUEUE: processed_articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  year-filter:
    build:
      context: .
      dockerfile: src/filters/year_filter/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: processed_articles
      OUTPUT_QUEUE: year_filtered_articles
    depends_on:
      rabbitmq:
        condition: service_healthy
  language-filter:
    build:
      context: .
      dockerfile: src/filters/language_filter/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MOM_HOST: rabbitmq
      INPUT_QUEUE: year_filtered_articles
      OUTPUT_QUEUE: article_results
    depends_on:
      rabbitmq:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      INPUT_FILE: /data/file1.csv
      SERVER_HOST: gateway
      SERVER_PORT: "5000"
    volumes:
      - ./samples:/data:ro
    depends_on:
      - gateway
      - preprocess
      - year-filter
      - language-filter
